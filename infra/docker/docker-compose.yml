version: '3.9'
services:
  frontend:
    build:
      context: ../../apps/frontend
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
    depends_on:
      - api-gateway

  api-gateway:
    build:
      context: ../../apps/api-gateway
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    environment:
      - REDIS_URL=${REDIS_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}

  auth-service:
    build: { context: ../../apps/services/auth, dockerfile: Dockerfile }
  user-service:
    build: { context: ../../apps/services/user, dockerfile: Dockerfile }
  product-service:
    build: { context: ../../apps/services/product, dockerfile: Dockerfile }
  search-service:
    build: { context: ../../apps/services/search, dockerfile: Dockerfile }
  order-service:
    build: { context: ../../apps/services/order, dockerfile: Dockerfile }
  payment-service:
    build: { context: ../../apps/services/payment, dockerfile: Dockerfile }
  review-service:
    build: { context: ../../apps/services/review, dockerfile: Dockerfile }
  notification-service:
    build: { context: ../../apps/services/notification, dockerfile: Dockerfile }
  shipping-service:
    build: { context: ../../apps/services/shipping, dockerfile: Dockerfile }
  admin-service:
    build: { context: ../../apps/services/admin, dockerfile: Dockerfile }

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zentro
    ports: ['5432:5432']

  redis:
    image: redis:7
    ports: ['6379:6379']

  rabbitmq:
    image: rabbitmq:3-management
    ports: ['5672:5672', '15672:15672']

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports: ['9200:9200']
